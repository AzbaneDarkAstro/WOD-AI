name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install deps
        run: |
          sudo apt update
          sudo apt install -y openjdk-17-jdk zip unzip git python3-pip build-essential libssl-dev libffi-dev python3-dev
          pip install --upgrade pip
          pip install buildozer Cython==0.29.33
      - name: Build APK
        run: |
          yes | buildozer android debug || true
          SDK=$HOME/.buildozer/android/platform/android-sdk
          yes | $SDK/cmdline-tools/*/bin/sdkmanager --licenses || true
          yes | $SDK/tools/bin/sdkmanager --licenses || true
          buildozer android debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: APK
          path: bin/*.apk
