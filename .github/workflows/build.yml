name: Build WOD-AI APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: kivy/buildozer:latest

    steps:
      - uses: actions/checkout@v4

      - name: Fix ownership
        run: |
          chown -R root:root .
          git config --global --add safe.directory /__w/WOD-AI/WOD-AI

      - name: Build APK
        run: |
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WOD-AI-APK
          path: bin/*.apk
