name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install deps
        run: |
          sudo apt update
          sudo apt install -y openjdk-17-jdk zip unzip git python3-pip python3-dev build-essential libssl-dev libffi-dev libsqlite3-dev
          pip install --upgrade pip
          pip install Cython==0.29.33 buildozer
      - name: Clean old build
        run: |
          rm -rf .buildozer
          rm -rf bin
      - name: Build APK
        run: |
          yes | buildozer android debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: APK
          path: bin/*.apk:     
