name: Build APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y openjdk-17-jdk zip unzip python3-pip libffi-dev libssl-dev
          pip install buildozer Cython==0.29.33
      - name: Accept SDK licenses
        run: |
          yes | buildozer android debug || true
          SDK=$HOME/.buildozer/android/platform/android-sdk
          TOOL=$(find $SDK -name sdkmanager | head -n 1)
          yes | $TOOL --sdk_root=$SDK --licenses || true
      - name: Build APK
        run: buildozer android debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WOD-AI-APK
          path: bin/*.apk
